services:
  postgres:
    image: postgres:16.10
    container_name: ai_meeting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # For local dev only. In production, use 'expose: ["5432"]' instead
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_meeting_backend
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    command: npm run start
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_meeting_worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    command: npm run worker
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
